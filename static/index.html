<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Device Fleet Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Mini Device Fleet Monitor</h1>
    </header>

    <main>
        <!-- Fleet summary cards -->
        <section id="summary" class="summary">
            <div class="card">
                <span class="card-label">Total</span>
                <span id="total-count" class="card-value">—</span>
            </div>
            <div class="card card-online">
                <span class="card-label">Online</span>
                <span id="online-count" class="card-value">—</span>
            </div>
            <div class="card card-offline">
                <span class="card-label">Offline</span>
                <span id="offline-count" class="card-value">—</span>
            </div>
        </section>

        <!-- Status messages -->
        <div id="status-msg" class="status-msg hidden"></div>

        <!-- Device table -->
        <section id="device-table-section">
            <table id="device-table">
                <thead>
                    <tr>
                        <th>Device</th>
                        <th>Status</th>
                        <th>Last Heartbeat</th>
                    </tr>
                </thead>
                <tbody id="device-tbody">
                    <tr><td colspan="3" class="center">Loading…</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <span id="last-refresh">—</span>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
